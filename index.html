<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Pretend Store</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Top Banner */
    header {
      background: var(--primary);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      z-index: 10;
    }
    header h1 { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: 0.5px; }
    .btn-manager {
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    /* POS Layout */
    .pos-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    /* Shelf (Items) */
    .shelf {
      flex: 1.4;
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      align-content: start;
    }
    .item-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 6px -2px rgba(0,0,0,0.05);
    }
    .item-visual {
      width: 110px;
      height: 110px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    .item-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }
    .item-name { font-size: 1.2rem; font-weight: 700; margin: 4px 0; }
    .item-price { font-size: 1.15rem; color: #475569; font-weight: 600; margin-bottom: 12px; }
    .btn-add {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-add:active { transform: scale(0.96); }

    /* Cart / Register Panel */
    .cart-panel {
      flex: 1;
      background: var(--card-bg);
      border-left: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 10px rgba(0,0,0,0.03);
    }
    .cart-header { padding: 16px; border-bottom: 2px solid var(--border); font-size: 1.3rem; font-weight: 800; }
    .cart-items { flex: 1; overflow-y: auto; padding: 12px; }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .cart-row-title { font-weight: 700; font-size: 1rem; }
    .cart-row-price { color: #64748b; font-size: 0.9rem; }
    .cart-stepper { display: flex; align-items: center; gap: 8px; }
    .btn-step {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }
    .cart-footer { padding: 20px; border-top: 2px solid var(--border); background: #f8fafc; }
    .cart-total-display { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 800; margin-bottom: 16px; }
    .btn-checkout {
      width: 100%;
      background: var(--success);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-checkout:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      border-radius: 20px;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
    }

    /* Manager Form Styles */
    .manager-section { margin-bottom: 20px; }
    .manager-section h3 { margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 4px; font-size: 0.95rem; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }
    .item-edit-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-save { flex: 2; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
    .btn-reset { flex: 1; background: #e2e8f0; color: #334155; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }

    /* Checkout Modal Styles */
    .pay-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--primary);
      background: white;
      color: var(--primary);
      font-weight: 800;
      border-radius: 12px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: white; }
    .cash-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    .cash-btn {
      background: #ecfdf5;
      border: 2px solid #059669;
      color: #047857;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }
    .sig-pad {
      border: 2px dashed #94a3b8;
      background: #f8fafc;
      border-radius: 12px;
      width: 100%;
      height: 140px;
      margin: 12px 0;
      touch-action: none;
    }

    /* Receipt Style */
    .receipt {
      background: #fff;
      border: 1px dashed #94a3b8;
      padding: 24px;
      border-radius: 12px;
      font-family: "Courier New", Courier, monospace;
      color: #1e293b;
      margin-bottom: 16px;
    }
    .receipt-header { text-align: center; border-bottom: 1px dashed #64748b; padding-bottom: 8px; margin-bottom: 12px; }
    .receipt-total { border-top: 1px dashed #64748b; padding-top: 8px; font-weight: 900; font-size: 1.2rem; margin-top: 12px; }
    .paid-stamp {
      color: var(--danger);
      border: 3px solid var(--danger);
      padding: 4px 12px;
      display: inline-block;
      font-weight: 900;
      border-radius: 8px;
      transform: rotate(-10deg);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Banner -->
  <header>
    <h1 id="bannerTitle">My Pretend Store</h1>
    <button class="btn-manager" onclick="openManager()">⚙️ Store Manager</button>
  </header>

  <!-- POS Main View -->
  <div class="pos-layout">
    <!-- Store Shelf (5 Items) -->
    <div class="shelf" id="shelf"></div>

    <!-- Cart & Register -->
    <div class="cart-panel">
      <div class="cart-header">🛒 Order Cart</div>
      <div class="cart-items" id="cartList"></div>
      <div class="cart-footer">
        <div class="cart-total-display">
          <span>Total:</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button id="checkoutBtn" class="btn-checkout" onclick="openCheckout()" disabled>Pay / Checkout</button>
      </div>
    </div>
  </div>

  <!-- Manager Modal -->
  <div class="modal-overlay" id="managerModal">
    <div class="modal-content">
      <h2>⚙️ Store Manager</h2>
      <div class="manager-section">
        <div class="form-group">
          <label>Store Name:</label>
          <input type="text" id="cfgStoreName" maxlength="30">
        </div>
        <div class="form-group">
          <label>Display Mode:</label>
          <select id="cfgDisplayMode">
            <option value="emoji">Emoji Mode (Instant Customization)</option>
            <option value="photo">Photo Mode (Uses images/1.png to 5.png)</option>
          </select>
        </div>
      </div>

      <div class="manager-section">
        <h3>Edit the 5 Shelf Items</h3>
        <div id="managerItemsContainer"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-save" onclick="saveManagerSettings()">Save & Close</button>
        <button class="btn-reset" onclick="resetDefaults()">Reset Defaults</button>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
      <h2>Payment Register</h2>
      <div class="pay-tabs">
        <button class="tab-btn active" id="tabCash" onclick="switchPayTab('cash')">💵 Cash</button>
        <button class="tab-btn" id="tabCard" onclick="switchPayTab('card')">💳 Credit Card</button>
      </div>

      <div style="font-size: 1.4rem; font-weight: 800; margin: 12px 0;">
        Total Due: <span id="payDue">$0.00</span>
      </div>

      <!-- Cash Interface -->
      <div id="cashView">
        <p>Tap cash received from customer:</p>
        <div class="cash-grid">
          <button class="cash-btn" onclick="addCash(1.00)">+$1.00</button>
          <button class="cash-btn" onclick="addCash(5.00)">+$5.00</button>
          <button class="cash-btn" onclick="addCash(10.00)">+$10.00</button>
          <button class="cash-btn" onclick="addCash(20.00)">+$20.00</button>
          <button class="cash-btn" onclick="addCash(0.25)">+$0.25</button>
          <button class="cash-btn" style="background:#fee2e2; border-color:#dc2626; color:#b91c1c;" onclick="clearCash()">Clear</button>
        </div>
        <div style="font-size: 1.1rem; line-height: 1.6;">
          <div>Tendered: <strong id="tenderedDisplay">$0.00</strong></div>
          <div>Change Due: <strong id="changeDisplay" style="color:var(--danger)">$0.00</strong></div>
        </div>
        <button id="btnFinishCash" class="btn-checkout" style="margin-top:16px;" onclick="finishCashSale()" disabled>Complete Cash Sale</button>
      </div>

      <!-- Card Interface -->
      <div id="cardView" style="display: none;">
        <p>Customer Sign Below:</p>
        <canvas class="sig-pad" id="sigPad"></canvas>
        <button class="btn-save" style="width:100%;" id="btnProcessCard" onclick="processCardSale()">Insert / Tap Card</button>
      </div>

      <button onclick="closeCheckout()" style="background:none; border:none; color:#64748b; margin-top:16px; font-weight:700; width:100%; cursor:pointer;">Cancel</button>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div class="modal-overlay" id="receiptModal">
    <div class="modal-content" style="max-width: 420px; text-align: center;">
      <div class="receipt" id="receiptContent"></div>
      <button class="btn-checkout" onclick="startNewCustomer()">Next Customer 🛒</button>
    </div>
  </div>

  <script>
    // --- 1. Sound Synthesizer (Zero Audio Files Required) ---
    let audioCtx = null;
    function playBeep(freq = 600, duration = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { /* Browser audio policy fallback */ }
    }

    function playDing() {
      playBeep(880, 0.15);
      setTimeout(() => playBeep(1174, 0.25), 100);
    }

    // --- 2. State & Default Data Model ---
    const DEFAULTS = {
      storeName: "Sweet Treats Bakery",
      displayMode: "emoji", // "emoji" or "photo"
      items: [
        { id: 1, name: "Cupcake", price: 2.50, emoji: "🧁" },
        { id: 2, name: "Pizza Slice", price: 3.00, emoji: "🍕" },
        { id: 3, name: "Juice Box", price: 1.50, emoji: "🧃" },
        { id: 4, name: "Popcorn", price: 2.00, emoji: "🍿" },
        { id: 5, name: "Toy Dino", price: 5.00, emoji: "🦖" }
      ]
    };

    let store = {};
    let cart = {}; // { itemId: quantity }
    let tenderedCash = 0;

    function initStore() {
      const saved = localStorage.getItem('pretend_store_data');
      if (saved) {
        try { store = JSON.parse(saved); } catch (e) { store = { ...DEFAULTS }; }
      } else {
        store = { ...DEFAULTS };
      }
      renderStore();
    }

    function renderStore() {
      document.getElementById('bannerTitle').textContent = store.storeName;
      const shelf = document.getElementById('shelf');
      shelf.innerHTML = '';

      store.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';

        // Image vs Emoji display with graceful fallback
        let visualHtml = `<div class="item-visual">${item.emoji}</div>`;
        if (store.displayMode === 'photo') {
          visualHtml = `
            <div class="item-visual">
              <img src="images/${item.id}.png" onerror="this.parentElement.innerHTML='${item.emoji}'" alt="${item.name}">
            </div>
          `;
        }

        card.innerHTML = `
          ${visualHtml}
          <div class="item-name">${item.name}</div>
          <div class="item-price">$${item.price.toFixed(2)}</div>
          <button class="btn-add" onclick="addToCart(${item.id})">Add to Cart</button>
        `;
        shelf.appendChild(card);
      });

      renderCart();
    }

    // --- 3. Cart Operations ---
    function addToCart(id) {
      playBeep(700, 0.08);
      cart[id] = (cart[id] || 0) + 1;
      renderCart();
    }

    function changeQty(id, delta) {
      playBeep(500, 0.05);
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];
      renderCart();
    }

    function getSubtotal() {
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = store.items.find(i => i.id === parseInt(id));
        if (item) total += item.price * qty;
      }
      return total;
    }

    function renderCart() {
      const cartList = document.getElementById('cartList');
      cartList.innerHTML = '';
      const total = getSubtotal();

      for (const [id, qty] of Object.entries(cart)) {
        const item = store.items.find(i => i.id === parseInt(id));
        if (!item) continue;

        const row = document.createElement('div');
        row.className = 'cart-row';
        row.innerHTML = `
          <div>
            <div class="cart-row-title">${item.emoji} ${item.name}</div>
            <div class="cart-row-price">$${item.price.toFixed(2)} ea</div>
          </div>
          <div class="cart-stepper">
            <button class="btn-step" onclick="changeQty(${item.id}, -1)">−</button>
            <span style="font-weight:700; width:20px; text-align:center;">${qty}</span>
            <button class="btn-step" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        `;
        cartList.appendChild(row);
      }

      document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
      document.getElementById('checkoutBtn').disabled = total <= 0;
    }

    // --- 4. Manager Page (localStorage Handlers) ---
    function openManager() {
      document.getElementById('cfgStoreName').value = store.storeName;
      document.getElementById('cfgDisplayMode').value = store.displayMode;

      const container = document.getElementById('managerItemsContainer');
      container.innerHTML = '';

      store.items.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'item-edit-grid';
        row.innerHTML = `
          <input type="text" id="mgr-name-${index}" value="${item.name}" placeholder="Item Name">
          <input type="number" step="0.25" min="0" id="mgr-price-${index}" value="${item.price.toFixed(2)}">
          <input type="text" maxlength="2" id="mgr-emoji-${index}" value="${item.emoji}" style="text-align:center;">
        `;
        container.appendChild(row);
      });

      document.getElementById('managerModal').style.display = 'flex';
    }

    function saveManagerSettings() {
      store.storeName = document.getElementById('cfgStoreName').value || "My Store";
      store.displayMode = document.getElementById('cfgDisplayMode').value;

      store.items.forEach((item, index) => {
        const nameVal = document.getElementById(`mgr-name-${index}`).value;
        const priceVal = parseFloat(document.getElementById(`mgr-price-${index}`).value);
        const emojiVal = document.getElementById(`mgr-emoji-${index}`).value;

        item.name = nameVal || `Item ${index + 1}`;
        item.price = isNaN(priceVal) ? 1.00 : priceVal;
        item.emoji = emojiVal || "📦";
      });

      localStorage.setItem('pretend_store_data', JSON.stringify(store));
      document.getElementById('managerModal').style.display = 'none';
      renderStore();
      playDing();
    }

    function resetDefaults() {
      if (confirm("Restore original store items and prices?")) {
        store = JSON.parse(JSON.stringify(DEFAULTS));
        localStorage.setItem('pretend_store_data', JSON.stringify(store));
        document.getElementById('managerModal').style.display = 'none';
        renderStore();
      }
    }

    // --- 5. Checkout & Mock Payments ---
    function openCheckout() {
      tenderedCash = 0;
      updateCashUI();
      switchPayTab('cash');
      document.getElementById('payDue').textContent = `$${getSubtotal().toFixed(2)}`;
      document.getElementById('checkoutModal').style.display = 'flex';
      initSigPad();
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function switchPayTab(tab) {
      document.getElementById('tabCash').classList.toggle('active', tab === 'cash');
      document.getElementById('tabCard').classList.toggle('active', tab === 'card');
      document.getElementById('cashView').style.display = tab === 'cash' ? 'block' : 'none';
      document.getElementById('cardView').style.display = tab === 'card' ? 'block' : 'none';
    }

    // Cash Handlers
    function addCash(amount) {
      playBeep(800, 0.05);
      tenderedCash += amount;
      updateCashUI();
    }

    function clearCash() {
      tenderedCash = 0;
      updateCashUI();
    }

    function updateCashUI() {
      const due = getSubtotal();
      const change = Math.max(0, tenderedCash - due);
      document.getElementById('tenderedDisplay').textContent = `$${tenderedCash.toFixed(2)}`;
      document.getElementById('changeDisplay').textContent = `$${change.toFixed(2)}`;
      document.getElementById('btnFinishCash').disabled = tenderedCash < due;
    }

    function finishCashSale() {
      const due = getSubtotal();
      const change = tenderedCash - due;
      showReceipt({
        method: "CASH",
        tendered: tenderedCash,
        change: change
      });
    }

    // Card & Signature Pad
    function initSigPad() {
      const canvas = document.getElementById('sigPad');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';

      let drawing = false;
      function start(e) { drawing = true; ctx.beginPath(); draw(e); }
      function stop() { drawing = false; }
      function draw(e) {
        if (!drawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      canvas.onpointerdown = start;
      canvas.onpointermove = draw;
      window.onpointerup = stop;
    }

    function processCardSale() {
      const btn = document.getElementById('btnProcessCard');
      btn.textContent = "Connecting to Bank...";
      btn.disabled = true;
      playBeep(900, 0.2);

      setTimeout(() => {
        btn.textContent = "Insert / Tap Card";
        btn.disabled = false;
        showReceipt({
          method: "CREDIT CARD",
          cardNum: "**** **** **** 4242"
        });
      }, 1500);
    }

    // --- 6. Digital Receipt ---
    function showReceipt(payDetails) {
      playDing();
      closeCheckout();

      const receiptEl = document.getElementById('receiptContent');
      const date = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let lines = '';

      for (const [id, qty] of Object.entries(cart)) {
        const item = store.items.find(i => i.id === parseInt(id));
        if (item) {
          lines += `
            <div style="display:flex; justify-content:space-between; margin:4px 0;">
              <span>${qty}x ${item.name}</span>
              <span>$${(item.price * qty).toFixed(2)}</span>
            </div>
          `;
        }
      }

      let paymentMeta = '';
      if (payDetails.method === 'CASH') {
        paymentMeta = `
          <div style="display:flex; justify-content:space-between; margin-top:8px;">
            <span>TENDERED CASH:</span><span>$${payDetails.tendered.toFixed(2)}</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-weight:bold;">
            <span>CHANGE GIVEN:</span><span>$${payDetails.change.toFixed(2)}</span>
          </div>
        `;
      } else {
        paymentMeta = `
          <div style="display:flex; justify-content:space-between; margin-top:8px;">
            <span>AUTH: APPROVED</span><span>VISA ${payDetails.cardNum}</span>
          </div>
        `;
      }

      receiptEl.innerHTML = `
        <div class="receipt-header">
          <h3 style="margin:0;">${store.storeName}</h3>
          <small>${date}</small>
        </div>
        ${lines}
        <div class="receipt-total">
          <div style="display:flex; justify-content:space-between;">
            <span>TOTAL:</span><span>$${getSubtotal().toFixed(2)}</span>
          </div>
        </div>
        ${paymentMeta}
        <div class="paid-stamp">PAID IN FULL</div>
      `;

      document.getElementById('receiptModal').style.display = 'flex';
    }

    function startNewCustomer() {
      cart = {};
      renderCart();
      document.getElementById('receiptModal').style.display = 'none';
      playBeep(520, 0.1);
    }

    // --- 7. Initialize & Register PWA Worker ---
    window.addEventListener('load', () => {
      initStore();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration skipped', err));
      }
    });
  </script>
</body>
</html>
